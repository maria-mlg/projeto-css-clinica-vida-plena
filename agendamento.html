<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento - Clínica Vida Plena</title>

    <link rel="stylesheet" href="style.css">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <header class="cabecalho">

        <h1 id="titulo">Clínica Vida Plena</h1>

        <nav class="menu">

            <a href="index.html">Início</a>

            <a href="agendamento.html">Agendamento</a>

        </nav>

    </header>


    <main class="conteudo">

        <h2 class="subtitulo">Agende sua consulta</h2>

        <p class="texto">
            Preencha os dados abaixo para solicitar o agendamento
            da sua consulta na Clínica Vida Plena.
        </p>


        <form class="formulario" action="#" method="post">

            <label for="nome">Nome Completo:</label>

            <input
                type="text"
                name="nome"
                id="nome"
                required
            >


            <label for="email">Email:</label>

            <input
                type="email"
                name="email"
                id="email"
            >


            <label for="telefone">Telefone:</label>

            <input
                type="tel"
                name="telefone"
                id="telefone"
                required
                inputmode="numeric"
                maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com DDD. Ex: (17) 98765-4321 ou 17987654321"
            >


            <label for="data">Data:</label>

            <input
                type="date"
                name="data"
                id="data"
            >


            <label for="hora">Horário:</label>

            <input
                type="time"
                name="hora"
                id="hora"
            >


            <label for="especialidade">Especialidade:</label>

            <select
                name="especialidade"
                id="especialidade"
            >

                <option value="">Selecione uma opção</option>

                <option value="clinico-geral">
                    Clínico Geral
                </option>

                <option value="cardiologia">
                    Cardiologia
                </option>

                <option value="dermatologia">
                    Dermatologia
                </option>

                <option value="pediatria">
                    Pediatria
                </option>

            </select>


            <label for="mensagem">Mensagem:</label>

            <textarea
                name="mensagem"
                id="mensagem"
                rows="4"
            ></textarea>


            <button type="submit">
                Confirmar agendamento
            </button>

        </form>

    </main>


    <footer class="rodape">

        <p>
            Clínica Vida Plena - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
